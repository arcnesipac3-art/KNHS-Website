services:
  - type: web
    name: knhs-backend
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --worker-class sync --threads 2 --timeout 120 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 --preload --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: RENDER
        value: true
